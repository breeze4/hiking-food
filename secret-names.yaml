# Names only. The values live in the BeeBaby store.
# The draft that `cos secrets adopt` writes for hiking-food. Adopt reads these
# names from /srv/beebaby/secrets/runtime/hiking-food.env, the file that
# HIKING_FOOD_ENV_FILE names. The backend reads all three at startup.
# HIKING_FOOD_OAUTH_ISSUER isn't secret, but it stays on the list so that the
# runtime file keeps the public issuer when delivery comes from the store.
secrets:
  - name: HIKING_FOOD_AUTH_PASSWORD
    for: [service]
  - name: HIKING_FOOD_JWT_KEY
    for: [service]
  - name: HIKING_FOOD_OAUTH_ISSUER
    for: [service]
