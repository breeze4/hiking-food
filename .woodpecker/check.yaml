when:
  - event: [push, pull_request]

steps:
  hiking-food-gates:
    image: python:3.12.13-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
    commands:
      - apt-get update && apt-get install --yes --no-install-recommends bash ca-certificates curl xz-utils && rm -rf /var/lib/apt/lists/*
      - curl --fail --silent --show-error --location --output /tmp/node.tar.xz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
      - echo '69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec  /tmp/node.tar.xz' | sha256sum --check
      - tar --extract --xz --file /tmp/node.tar.xz --directory /opt
      - export PATH="/opt/node-v22.14.0-linux-x64/bin:$PATH" && corepack enable && corepack prepare pnpm@11.5.1 --activate && bash scripts/ci-gates.sh
